server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: offer-relay
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:dev_user}
    password: ${RABBIT_PASSWORD:dev_password}
    # 재제안도 제안 발행이라 dispatch-engine 과 똑같이 켜야 한다. 안 켜면 확인 응답을 영영
    # 못 받아서 후보 한 명당 5초씩 버리고 실패한다 — 라이더 6명이 25초 만에 다 타버린다.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true
    listener:
      simple:
        # AUTO 는 "리스너가 예외 없이 끝나면 ack" 다. 카프카의 자동 커밋(시간이 되면 오프셋을
        # 옮기는 것)과 이름만 비슷하고 하는 일이 다르다. 손으로 ack 하려고 예외를 잡아버리면
        # 아래 retry 가 아예 안 걸려서, 레디스가 잠깐 끊긴 동안 메시지가 초당 수천 번 다시 돈다.
        acknowledge-mode: auto
        # 만료 제안은 재제안까지 붙어 있는 무거운 작업이라 조금씩 가져온다.
        prefetch: 20
        observation-enabled: true
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 500ms
        # 3회를 다 쓰면 requeue 없이 버린다. 큐에 DLX 를 걸어놔서 그게
        # dispatch.offer.expired.dlq 로 간다 — 그냥 버리면 그 주문은 재제안을 영영 못 받는다.
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    template:
      observation-enabled: true

delivery:
  relay:
    # 이 횟수까지 제안했는데 아무도 안 받으면 dispatch.failed 로 넘긴다.
    # 10초짜리 제안이 다섯 번이면 50초다. 손님이 앱을 보고 있는데 1분 넘게 "배차 중" 이면
    # 그건 배차가 아니라 방치라, 차라리 빨리 실패로 알려주고 다시 시도하게 하는 게 낫다.
    max-attempts: 5

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OTel 자바 에이전트가 MDC 에 trace_id/span_id 를 꽂아준다.
# 로키에서 로그 보다가 바로 템포 트레이스로 뛰려면 이 두 개가 로그에 있어야 한다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
