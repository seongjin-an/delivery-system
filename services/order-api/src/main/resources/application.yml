server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: order-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:33306/delivery?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:dev_user}
    password: ${DB_PASSWORD:dev_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
    template:
      observation-enabled: true     # 프로듀서 스팬 + 레코드 헤더에 traceparent 심기

delivery:
  outbox:
    # 아웃박스 행을 카프카로 내보내는 방식.
    #   CDC    — Debezium 이 MySQL binlog 를 읽어서 보낸다 (기본값). 앱은 넣기만 한다.
    #   POLLER — 앱이 200ms 마다 테이블을 훑어서 보낸다. 두 방식을 비교할 때 이걸로 띄운다.
    # CDC 로 두면 infra/register-debezium.sh 로 커넥터가 등록돼 있어야 이벤트가 나간다.
    mode: ${OUTBOX_MODE:CDC}

    # POLLER 모드에서만 쓴다
    poll-interval-ms: 200
    batch-size: 100

    # CDC 모드에서만 쓴다. binlog 에 적힌 순간 행은 할 일이 끝나지만,
    # "이벤트가 들어가긴 했나" 를 눈으로 볼 창을 한 시간 남겨둔다.
    purge-after-minutes: 60
    purge-interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OTel 자바 에이전트가 MDC 에 trace_id/span_id 를 꽂아준다.
# 로키에서 로그 보다가 바로 템포 트레이스로 뛰려면 이 두 개가 로그에 있어야 한다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
