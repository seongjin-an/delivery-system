server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: dispatch-engine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      # CandidateFinder 가 상태 30개를 파이프라인으로 읽는다. 파이프라인은 공유 연결을 못 쓰고 전용 연결을
      # 따로 잡는데, 풀이 없으면 그 전용 연결을 검색마다 새로 열고 닫는다. 재보니 검색 100번에 연결이 102개 생겼다.
      # 닫힌 연결은 TIME_WAIT 로 포트를 한동안 쥐고 있어서, 검색 초당 1000건에서 로컬 포트가 바닥났다
      # (Can't assign requested address, 요청 절반 실패). 풀을 켜면 검색 100번에 새 연결 3개였고 실패는 0 이었다.
      # 일반 명령은 풀을 켜도 계속 공유 연결 하나로 간다. 풀은 파이프라인과 트랜잭션만 쓴다.
      lettuce:
        pool:
          enabled: true
          max-active: 16
          # 풀이 다 차면 기본값은 끝없이 기다린다. 배차가 멈추는 것보다 예외가 나는 게 낫다
          max-wait: 500ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      group-id: dispatch-engine
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest    # 주문은 하나도 흘리면 안 된다
      enable-auto-commit: false
    listener:
      ack-mode: manual
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    template:
      observation-enabled: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:dev_user}
    password: ${RABBIT_PASSWORD:dev_password}
    # 브로커가 "받았다" 고 답할 때까지 확인한다. 안 켜면 발행이 실패해도 코드가 성공으로 알고
    # 넘어가서, 아무한테도 안 간 제안이 보드에는 OFFERED 로 남는다.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      observation-enabled: true      # AMQP 헤더로도 traceparent 를 넘긴다

delivery:
  listener:
    order-created:
      topic: order.created
      concurrency: 3
  dispatch-outbox:
    # 수락 Lua 가 넣은 배차 확정 이벤트를 이 간격으로 꺼내 보낸다. 수락 응답은 이걸 안 기다린다.
    # 이만큼이 order-api 가 ASSIGNED 를 늦게 아는 최대치다(보내는 시간 빼고).
    drain-interval: 50ms
    # 보내다 죽어서 inflight 에 남은 걸 다시 보내기까지. 카프카 전송 한도(5초)보다 넉넉해야 한다.
    # 짧으면 지금 보내는 중인 걸 다른 인스턴스가 또 보낸다(두 번 가도 order-api 가 걸러주긴 한다).
    stuck-after: 30s
    recover-interval: 10s
  dispatch:
    # 후보 검색 반경. 넓히면 후보는 늘지만 GEOSEARCH 비용도 같이 오른다.
    search-radius-meters: 3000
    # GEOSEARCH 로 몇 명까지 훑을지. 10명만 뽑으면 배달 중인 사람이 걸러진 뒤 남는 게 없다.
    # 점심시간에는 절반 이상이 배달 중이라 30명 중 12명만 남기도 한다.
    geo-count: 30
    max-candidates: 10
    # 대기 보너스 상한(분). 10분 넘게 기다린 라이더는 1km 정도 더 멀어도 가까운 사람을 이긴다.
    wait-bonus-cap-minutes: 10
    # OFFERED 인데 이만큼 지났으면 좀비다. 제안이 10초짜리인데 이만큼 남아 있다는 건
    # 타이머 메시지가 애초에 없었다는 뜻이다. offer-relay 큐 랙을 보고 조정한다.
    zombie-threshold: 30s

  # 락 TTL 세 개(lease-ttl 15s, rider-lock-ttl 12s, state-ttl 10m)는 여기 없다.
  # offer-relay 와 반드시 같은 값이어야 해서 common.dispatch.OfferProperties 에 기본값으로 박아뒀다.
  # 바꾸려면 delivery.offer.* 로 덮으면 되는데, 그때는 offer-relay 쪽에도 똑같이 넣어야 한다.

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OTel 자바 에이전트가 MDC 에 trace_id/span_id 를 꽂아준다.
# 로키에서 로그 보다가 바로 템포 트레이스로 뛰려면 이 두 개가 로그에 있어야 한다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
