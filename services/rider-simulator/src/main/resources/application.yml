server:
  port: ${SERVER_PORT:8097}

spring:
  application:
    name: rider-simulator
  threads:
    virtual:
      enabled: true    # 라이더 수천 명을 흉내내는 데 가상 스레드가 제일 편하다 (Java 21)

delivery:
  simulator:
    # 부하 대상. location-ingest 를 여러 개 띄우면 앞에 nginx 를 두고 그 주소를 넣는다.
    ingest-url: ${INGEST_URL:http://localhost:8091}
    order-url: ${ORDER_URL:http://localhost:8090}
    riders: 1000
    location-interval-ms: 3000
    orders-per-sec: 20
    # 라이더가 제안을 수락할 확률 / 수락까지 걸리는 시간
    accept-rate: 0.6
    accept-delay-ms: 2000
    # 서울 중심 좌표 기준으로 흩뿌린다
    center-lat: 37.5665
    center-lng: 126.9780
    spread-km: 8

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# OTel 자바 에이전트가 MDC 에 trace_id/span_id 를 꽂아준다.
# 로키에서 로그 보다가 바로 템포 트레이스로 뛰려면 이 두 개가 로그에 있어야 한다.
logging:
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id:-},%X{span_id:-}]"
